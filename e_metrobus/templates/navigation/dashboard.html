{% extends "base.html" %}

{% load static %}
{% load i18n %}

<!--#17BEBB-->

{% block content %}
<div class="pattern-bg"></div>
<div class="cell dashboard">
  <div class="grid-x align-center align-middle text-center">
    {% for cat_name, category, ellipse in categories %}

          <div class="cell small-6 dashboard__category">
            <a href="{% url 'navigation:question' cat_name %}">
              <!-- Question 1/5 -->
              <svg viewBox="0 0 100 100" width="100%" height="100%">
                {% if ellipse.share == 1 %}
                  <ellipse cx="50" cy="50" rx="43%" ry="43%" style="fill:#F0D722;stroke:#252424;stroke-width:7%" />
                {% else %}
                  <ellipse cx="50" cy="50" rx="43%" ry="43%" style="fill:#F0D722;stroke:#EFEFEF;stroke-width:7%" />
                  <path d="{{ellipse}}" style="fill:rgba(0,0,0,0);stroke:#17BEBB;stroke-width: 7%;" />
                {% endif %}
              </svg>
              <div class="dashboard__img">
                <img src="{% static category.icon %}">
              </div>
            </a>
            <div class="dashboard__header">{{category.get_label}}</div>
          </div>
    {% endfor %}

    {% if first_time %}
      <div id="tour_div" class="cell small-10" data-closable>
        <p id="tour_text"></p>
        <button type="button" onclick="skip_tour();">{% trans "Überspringen" %}</button>
        <button class="close-button" type="button" name="close-button" onclick="next_tour();">x</button>
      </div>
    {% endif %}
  </div>
</div>

{% endblock content %}

{% block javascript %}
  {{block.super}}
  <script>
  {% if first_time %}
    var tour_counter = 0;
    var tour_texts = [
      "{% trans "Hier kannst Du weiter entdecken und Spaß mit dem Quiz haben! Die erste Frage hast Du schon beantwortet!" %}",
      "{% trans "Zweiter Text" %}",
      "{% trans "Dritter Text" %}"
    ];
    var tour_classes = ["dashboard__info", "dashboard__header", "dashboard__info"];

    function next_tour() {
      if (tour_counter < tour_texts.length) {
        if (tour_counter > 0) {
          $("#tour_div").removeClass(tour_classes[tour_counter - 1]);
        }
        $("#tour_div").addClass(tour_classes[tour_counter]);
        $("#tour_text").html(tour_texts[tour_counter]);
        tour_counter += 1;
      } else {
        $("#tour_div").hide();
      }
    };

    function skip_tour() {
      $("#tour_div").hide();
    }

    next_tour();
  {% endif %}
  </script>
{% endblock javascript %}
